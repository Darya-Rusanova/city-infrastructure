<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Пользователи')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <div class="page-head">
        <div><h1>Пользователи</h1><p class="muted">Список зарегистрированных пользователей, доступен администратору.</p></div>
    </div>
    <div class="card">
        <div class="table-wrap">
            <table class="table">
                <thead><tr><th>№</th><th>Имя пользователя</th><th>Имя и фамилия</th></tr></thead>
                <tbody>
                <tr th:each="u : ${users}">
                    <td th:text="${u.id}">1</td>
                    <td th:text="${u.username}">user1</td>
                    <td th:text="${u.fullName}">Иван Иванов</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/app.js(v=2)}"></script>
</body>
</html>
