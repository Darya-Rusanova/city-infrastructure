<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ошибка')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container narrow">
    <div class="card error-card">
        <div class="error-code" th:text="${status} ?: 'Ошибка'">404</div>
        <h1 th:text="${status == 403} ? 'Нет доступа' : (${status == 404} ? 'Страница не найдена' : (${status == 503} ? 'Сервис недоступен' : 'Что-то пошло не так'))">Что-то пошло не так</h1>
        <p class="muted" th:if="${message != null and !#strings.isEmpty(message)}" th:text="${message}">Подробности</p>
        <a class="btn btn-primary" th:href="@{/}">На главную</a>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/app.js(v=2)}"></script>
</body>
</html>
