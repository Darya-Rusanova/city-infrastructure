server:
  port: 8080
  servlet:
    session:
      timeout: 60m

spring:
  application:
    name: frontend
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8

services:
  auth:
    url: ${AUTH_SERVICE_URL:http://auth-service:8080}
  transport:
    url: ${TRANSPORT_SERVICE_URL:http://transport-service:8080}
  utility:
    url: ${UTILITY_SERVICE_URL:http://utility-service:8080}
  environment:
    url: ${ENVIRONMENT_SERVICE_URL:http://environment-service:8080}
  billing:
    url: ${BILLING_SERVICE_URL:http://billing-service:8080}
    webhook-secret: ${WEBHOOK_SECRET:}
  notification:
    url: ${NOTIFICATION_SERVICE_URL:http://notification-service:8080}

logging:
  level:
    ru.isu.cityinfra: DEBUG
    org.springframework.web: INFO
