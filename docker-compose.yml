version: "3.9"

services:

  auth-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: auth_db
    ports:
      - "3311:3306"
    volumes:
      - auth-data:/var/lib/mysql

  auth-service:
    build: ./auth-service
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://auth-db:3306/auth_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - auth-db

  transport-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: transport_db
    ports:
      - "3312:3306"
    volumes:
      - transport-data:/var/lib/mysql

  transport-service:
    build: ./transport-service
    ports:
      - "8082:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://transport-db:3306/transport_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - transport-db

  utility-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: utility_db
    ports:
      - "3313:3306"
    volumes:
      - utility-data:/var/lib/mysql

  utility-service:
    build: ./utility-service
    ports:
      - "8083:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://utility-db:3306/utility_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: ${JWT_SECRET}
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
    depends_on:
      - utility-db

  environment-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: environment_db
    ports:
      - "3314:3306"
    volumes:
      - environment-data:/var/lib/mysql

  environment-service:
    build: ./environment-service
    ports:
      - "8084:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://environment-db:3306/environment_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - environment-db

  billing-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: billing_db
    ports:
      - "3315:3306"
    volumes:
      - billing-data:/var/lib/mysql

  billing-service:
    build: ./billing-service
    ports:
      - "8085:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://billing-db:3306/billing_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: ${JWT_SECRET}
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
    depends_on:
      - billing-db

  notification-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: notification_db
    ports:
      - "3316:3306"
    volumes:
      - notification-data:/var/lib/mysql

  notification-service:
    build: ./notification-service
    ports:
      - "8086:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://notification-db:3306/notification_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - notification-db

  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8080
      TRANSPORT_SERVICE_URL: http://transport-service:8080
      UTILITY_SERVICE_URL: http://utility-service:8080
      ENVIRONMENT_SERVICE_URL: http://environment-service:8080
      BILLING_SERVICE_URL: http://billing-service:8080
    depends_on:
      - auth-service
      - transport-service
      - utility-service
      - environment-service
      - billing-service

volumes:
  auth-data:
  transport-data:
  utility-data:
  environment-data:
  billing-data:
  notification-data:
