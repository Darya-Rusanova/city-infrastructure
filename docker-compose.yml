services:

  auth-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: auth_db
    ports:
      - "3311:3306"
    volumes:
      - auth-data:/var/lib/mysql
    healthcheck: &db-healthcheck
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  auth-service:
    build: ./auth-service
    restart: on-failure
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://auth-db:3306/auth_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: ${JWT_SECRET:?Не задан JWT_SECRET в файле .env}
      TZ: Asia/Irkutsk
    depends_on:
      auth-db:
        condition: service_healthy

  transport-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: transport_db
    ports:
      - "3312:3306"
    volumes:
      - transport-data:/var/lib/mysql
    healthcheck: *db-healthcheck

  transport-service:
    build: ./transport-service
    restart: on-failure
    ports:
      - "8082:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://transport-db:3306/transport_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: ${JWT_SECRET:?Не задан JWT_SECRET в файле .env}
      TZ: Asia/Irkutsk
    depends_on:
      transport-db:
        condition: service_healthy

  utility-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: utility_db
    ports:
      - "3313:3306"
    volumes:
      - utility-data:/var/lib/mysql
    healthcheck: *db-healthcheck

  utility-service:
    build: ./utility-service
    restart: on-failure
    ports:
      - "8083:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://utility-db:3306/utility_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: ${JWT_SECRET:?Не задан JWT_SECRET в файле .env}
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
      TZ: Asia/Irkutsk
    depends_on:
      utility-db:
        condition: service_healthy

  environment-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: environment_db
    ports:
      - "3314:3306"
    volumes:
      - environment-data:/var/lib/mysql
    healthcheck: *db-healthcheck

  environment-service:
    build: ./environment-service
    restart: on-failure
    ports:
      - "8084:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://environment-db:3306/environment_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: ${JWT_SECRET:?Не задан JWT_SECRET в файле .env}
      TZ: Asia/Irkutsk
    depends_on:
      environment-db:
        condition: service_healthy

  billing-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: billing_db
    ports:
      - "3315:3306"
    volumes:
      - billing-data:/var/lib/mysql
    healthcheck: *db-healthcheck

  billing-service:
    build: ./billing-service
    restart: on-failure
    ports:
      - "8085:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://billing-db:3306/billing_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: ${JWT_SECRET:?Не задан JWT_SECRET в файле .env}
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
      TZ: Asia/Irkutsk
    depends_on:
      billing-db:
        condition: service_healthy

  notification-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: notification_db
    ports:
      - "3316:3306"
    volumes:
      - notification-data:/var/lib/mysql
    healthcheck: *db-healthcheck

  notification-service:
    build: ./notification-service
    restart: on-failure
    ports:
      - "8086:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://notification-db:3306/notification_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: ${JWT_SECRET:?Не задан JWT_SECRET в файле .env}
      TZ: Asia/Irkutsk
    depends_on:
      notification-db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8080
      TRANSPORT_SERVICE_URL: http://transport-service:8080
      UTILITY_SERVICE_URL: http://utility-service:8080
      ENVIRONMENT_SERVICE_URL: http://environment-service:8080
      BILLING_SERVICE_URL: http://billing-service:8080
      JWT_SECRET: ${JWT_SECRET:?Не задан JWT_SECRET в файле .env}
      TZ: Asia/Irkutsk
    depends_on:
      auth-service:
        condition: service_started
      transport-service:
        condition: service_started
      utility-service:
        condition: service_started
      environment-service:
        condition: service_started
      billing-service:
        condition: service_started

volumes:
  auth-data:
  transport-data:
  utility-data:
  environment-data:
  billing-data:
  notification-data: